[build]
  command = "npm run build"
  publish = "_site"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Internal docs stay out of search engines.
[[headers]]
  for = "/design-system/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
